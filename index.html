<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest & Highway Telegram Guard System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 15px; }
        h1 { color: #00E676; margin-bottom: 15px; }
        
        .role-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .role-btn { background: #222; color: #aaa; border: 2px solid #444; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; flex: 1; max-width: 200px; }
        .role-btn.active { background: #00E676; color: #000; border-color: #00E676; }

        .panel { display: none; background: #1e1e1e; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; }
        .panel.active { display: block; }

        label { display: block; margin-top: 10px; font-size: 14px; color: #aaa; }
        input, select, button.action-btn { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; }
        button.action-btn { background: #00E676; color: #000; font-weight: bold; cursor: pointer; margin-top: 15px; border: none; }
        button.action-btn:hover { background: #00c865; }

        .status-box { padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; text-align: center; margin-bottom: 15px; background: #2e7d32; }
        .danger { background: #c62828 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #webcam-container { position: relative; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; }
        video { width: 100%; display: block; }
        .log-box { background: #181818; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-top: 10px; max-height: 150px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>

    <h1>🛡️ RoadGuardian & Forest AI</h1>

    <!-- Role Switcher -->
    <div class="role-container">
        <button class="role-btn active" onclick="switchRole('admin')">👨‍💼 Admin</button>
        <button class="role-btn" onclick="switchRole('visitor')">👤 Visitor</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="panel active">
        <h3>👨‍💼 Admin Management</h3>
        <hr style="border-color:#333; margin:10px 0;">
        
        <label>૧. વિઝિટરનો મોબાઈલ નંબર:</label>
        <input type="tel" id="admin-phone" placeholder="+91 9876543210">

        <label>૨. કોડની સમય મર્યાદા (Validity):</label>
        <select id="admin-validity">
            <option value="10">10 Minutes</option>
            <option value="60">1 Hour</option>
            <option value="300">5 Hours</option>
            <option value="600">10 Hours</option>
            <option value="1440">24 Hours</option>
            <option value="always">Always (Permanent)</option>
        </select>

        <button class="action-btn" onclick="generateVisitorCode()">🔑 Generat Code for Visitor</button>

        <div id="generated-code-box" class="log-box" style="display:none; color:#00E676; margin-top:15px; font-size:14px;"></div>

        <h4 style="margin-top:20px;">🖥️ Live Monitoring & Camera</h4>
        <div id="status-box" class="status-box">SYSTEM ACTIVE - SAFE</div>
        <div id="webcam-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- VISITOR PANEL -->
    <div id="visitor-panel" class="panel">
        <h3>👤 Visitor Portal</h3>
        <hr style="border-color:#333; margin:10px 0;">

        <label>૧. Admin દ્વારા અપાયેલ ૬ અંકનો પાસકોડ નાખો:</label>
        <input type="text" id="visitor-code" placeholder="123456">

        <button class="action-btn" onclick="registerVisitor()">✅ Verify & Register Location</button>

        <div id="visitor-status" class="log-box" style="margin-top:15px;">કૃપા કરીને કોડ નાખી રજિસ્ટર કરો.</div>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <script>
        // --- ⚙️ Telegram Configuration ---
        const BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN"; // તમારો BotFather ટોકન
        const ADMIN_CHAT_ID = "YOUR_ADMIN_CHAT_ID";   # તમારો Telegram User ID

        let visitorDatabase = JSON.parse(localStorage.getItem('visitor_db')) || [];
        let currentVisitor = null;
        let lastAlertTime = 0;

        // Switch Roles
        function switchRole(role) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if(role === 'admin') {
                document.querySelectorAll('.role-btn')[0].classList.add('active');
                document.getElementById('admin-panel').classList.add('active');
            } else {
                document.querySelectorAll('.role-btn')[1].classList.add('active');
                document.getElementById('visitor-panel').classList.add('active');
            }
        }

        // Setup Rear Camera
        async function setupCamera() {
            try {
                const video = document.getElementById('webcam');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
            } catch(e) {
                console.error("Camera access failed", e);
            }
        }

        // 1. Admin: Make Visitor Code
        function generateVisitorCode() {
            const phone = document.getElementById('admin-phone').value;
            const validity = document.getElementById('admin-validity').value;

            if(!phone) { alert("કૃપા કરીને ફોન નંબર લખો!"); return; }

            const code = Math.floor(100000 + Math.random() * 900000).toString();
            const expireAt = validity === "always" ? "always" : Date.now() + (parseInt(validity) * 60 * 1000);

            const visitorData = { code, phone, expireAt, lat: null, lon: null, telegramChatId: null };
            visitorDatabase.push(visitorData);
            localStorage.setItem('visitor_db', JSON.stringify(visitorDatabase));

            const codeBox = document.getElementById('generated-code-box');
            codeBox.style.display = "block";
            codeBox.innerHTML = `✅ <b>નવો વિઝિટર કોડ બનેલ છે:</b><br>🔑 Passcode: <b>${code}</b><br>📱 Phone: ${phone}<br>⏱️ Expiration: ${validity === 'always' ? 'Always' : validity + ' Minutes'}`;
        }

        // 2. Visitor: Verify Code and Save GPS Location
        function registerVisitor() {
            const enteredCode = document.getElementById('visitor-code').value.trim();
            const visitorStatus = document.getElementById('visitor-status');

            const index = visitorDatabase.findIndex(v => v.code === enteredCode);
            if(index === -1) {
                visitorStatus.style.color = "#ff5252";
                visitorStatus.innerHTML = "❌ ખોટો પાસકોડ!";
                return;
            }

            const record = visitorDatabase[index];
            if(record.expireAt !== "always" && Date.now() > record.expireAt) {
                visitorStatus.style.color = "#ff5252";
                visitorStatus.innerHTML = "⏳ પાસકોડ એક્સપાયર થઈ ગયો છે!";
                return;
            }

            // Get GPS location
            if(navigator.geolocation) {
                visitorStatus.innerHTML = "⏳ તમારું Location લેવાઈ રહ્યું છે...";
                navigator.geolocation.getCurrentPosition(position => {
                    record.lat = position.coords.latitude;
                    record.lon = position.coords.longitude;
                    localStorage.setItem('visitor_db', JSON.stringify(visitorDatabase));
                    currentVisitor = record;

                    visitorStatus.style.color = "#00E676";
                    visitorStatus.innerHTML = `✅ રજિસ્ટ્રેશન સફળ!<br>📍 GPS locked: ${record.lat.toFixed(4)}, ${record.lon.toFixed(4)}<br>તમારા ૧૦ મીટર વિસ્તારમાં જ એલર્ટ આવશે.`;
                }, () => {
                    visitorStatus.innerHTML = "⚠️ Location પરમિશન જરૂરી છે!";
                });
            }
        }

        // 3. Send Telegram Photo Alert directly via API
        function triggerTelegramAlert(alertDetail, incidentLat = 0, incidentLon = 0) {
            const canvas = document.getElementById('photoCanvas');
            const video = document.getElementById('webcam');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                // A. ALWAYS Send to Admin
                sendPhotoToTelegram(ADMIN_CHAT_ID, blob, `🚨 ADMIN ALERT: ${alertDetail}`);

                // B. Check Registered Visitors within 10 meters
                visitorDatabase.forEach(v => {
                    if(v.lat && v.lon) {
                        const dist = calculateDistance(incidentLat, incidentLon, v.lat, v.lon);
                        if(dist <= 10 && v.telegramChatId) {
                            sendPhotoToTelegram(v.telegramChatId, blob, `⚠️ ALERT: ${alertDetail} (તમારાથી ${Math.round(dist)}m દૂર!)`);
                        }
                    }
                });
            }, 'image/jpeg', 0.6);
        }

        function sendPhotoToTelegram(chatId, imageBlob, captionText) {
            const formData = new FormData();
            formData.append("chat_id", chatId);
            formData.append("photo", imageBlob, "threat.jpg");
            formData.append("caption", captionText);

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).then(() => console.log("Telegram alert dispatched!"))
              .catch(err => console.error("Telegram API Error:", err));
        }

        // Haversine formula to calculate distance in meters
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.onload = setupCamera;
    </script>
</body>
</html>
