<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuardian & Forest AI Surveillance</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0d1117; 
            color: #f0f6fc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }

        h2 { 
            text-align: center; 
            color: #2f81f7; 
            margin-bottom: 12px; 
            font-size: 1.2rem; 
        }

        /* Live Status Badge */
        .status-card { 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-bottom: 12px; 
            background: #238636; 
            color: #ffffff; 
            transition: background 0.3s ease; 
        }
        .status-card.alert { 
            background: #da3633; 
            animation: blink 1s infinite; 
        }

        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.5; } 
            100% { opacity: 1; } 
        }

        /* Camera Feed Container */
        .camera-wrapper { 
            position: relative; 
            width: 100%; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #30363d; 
            aspect-ratio: 4/3; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        /* Simple Log Terminal */
        .log-container { 
            margin-top: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 10px; 
            height: 120px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 0.8rem; 
            color: #8b949e; 
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.success { color: #3fb950; }
        .log-entry.warn { color: #f85149; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ Live Surveillance Terminal</h2>

        <!-- Status Box -->
        <div id="status-card" class="status-card">SYSTEM ACTIVE - MONITORING</div>

        <!-- Camera Frame Only -->
        <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <!-- Minimal Log Output -->
        <div id="log-terminal" class="log-container">
            <div class="log-entry">[SYSTEM] Initializing camera & sensors...</div>
        </div>
    </div>

    <!-- Hidden Canvas for Frame Capture -->
    <canvas id="captureCanvas"></canvas>

    <script>
        // --- ⚙️ Credentials & API Configuration ---
        const TELEGRAM_BOT_TOKEN = "8606654492:AAEJA73s0KDpqxPjthTNawpQlz7DYkddd1U";
        const TELEGRAM_CHAT_ID = "8517706642";

        const EMAILJS_SERVICE_ID = "service_9t8ppxg";
        const EMAILJS_PUBLIC_KEY = "ZXgCOupaENPcCchAD";
        
        // Department Template IDs
        const EMAILJS_TEMPLATE_HIGHWAY = "template_1efdzc9"; // Highway Dept
        const EMAILJS_TEMPLATE_FOREST = "template_cvp7e1i";  // Forest Dept

        let currentLat = "22.3039"; // Default Rajkot Coordinates
        let currentLon = "70.8022";

        // Initialize EmailJS
        emailjs.init(EMAILJS_PUBLIC_KEY);

        // --- 1. Camera & GPS Initialization ---
        async function initSystem() {
            logMsg("Requesting camera access...", "info");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                document.getElementById('webcam').srcObject = stream;
                logMsg("Camera initialized successfully.", "success");
            } catch (err) {
                logMsg("Camera Error: " + err.message, "warn");
            }

            // Get Geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude.toFixed(5);
                        currentLon = pos.coords.longitude.toFixed(5);
                        logMsg(`GPS Locked: ${currentLat}, ${currentLon}`, "success");
                    },
                    err => logMsg("GPS Error: Using default Rajkot location", "warn")
                );
            }
        }

        // --- 2. Dispatch Alerts to Telegram & Dual Gmail ---
        function triggerDetectionAlert(detectionType, details) {
            updateStatusBox(`ALERT: ${detectionType} Detected!`, true);
            logMsg(`[ALERT] ${detectionType} detected! Dispatching notifications...`, "warn");

            const canvas = document.getElementById('captureCanvas');
            const video = document.getElementById('webcam');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // A. Send Photo & Metadata to Telegram
            canvas.toBlob(blob => {
                sendTelegramAlert(blob, detectionType, details);
            }, 'image/jpeg', 0.8);

            // B. Send Email Alerts via EmailJS (To Highway & Forest Templates)
            sendEmailAlerts(detectionType, details);
        }

        // Send Direct Photo to Telegram
        function sendTelegramAlert(imageBlob, type, details) {
            const formData = new FormData();
            formData.append("chat_id", TELEGRAM_CHAT_ID);
            formData.append("photo", imageBlob, "detection_snapshot.jpg");
            formData.append("caption", 
                `🚨 *CRITICAL SURVEILLANCE ALERT*\n\n` +
                `📌 *Type:* ${type}\n` +
                `📝 *Details:* ${details}\n` +
                `📍 *Location:* https://maps.google.com/?q=${currentLat},${currentLon}\n` +
                `⏰ *Time:* ${new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })}`
            );

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) logMsg("Telegram photo alert dispatched!", "success");
                else logMsg("Telegram API Error", "warn");
            })
            .catch(err => logMsg("Telegram Network Error: " + err.message, "warn"));
        }

        // Send Email to Both Department Templates
        function sendEmailAlerts(type, details) {
            const emailParams = {
                alert_type: type,
                details_message: details,
                latitude: currentLat,
                longitude: currentLon,
                google_maps_link: `https://maps.google.com/?q=${currentLat},${currentLon}`,
                timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
            };

            // 1. Send to Highway Department
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_HIGHWAY, emailParams)
                .then(() => logMsg("Highway Dept Email Sent", "success"))
                .catch(err => logMsg("Highway Email Failed: " + JSON.stringify(err), "warn"));

            // 2. Send to Forest Department
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_FOREST, emailParams)
                .then(() => logMsg("Forest Dept Email Sent", "success"))
                .catch(err => logMsg("Forest Email Failed: " + JSON.stringify(err), "warn"));
            
            setTimeout(() => updateStatusBox("SYSTEM ACTIVE - MONITORING", false), 8000);
        }

        // Log Message Helper
        function logMsg(msg, type = "info") {
            const terminal = document.getElementById('log-terminal');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Status UI Handler
        function updateStatusBox(text, isAlert = false) {
            const box = document.getElementById('status-card');
            box.innerText = text;
            if (isAlert) box.classList.add('alert');
            else box.classList.remove('alert');
        }

        // Start on Page Load
        window.onload = initSystem;
    </script>
</body>
</html>
