<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuardian & Forest AI Terminal</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0d1117; 
            color: #f0f6fc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }

        h2 { 
            text-align: center; 
            color: #2f81f7; 
            margin-bottom: 12px; 
            font-size: 1.2rem; 
        }

        /* Live Status Badge */
        .status-card { 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-bottom: 12px; 
            background: #238636; 
            color: #ffffff; 
            transition: background 0.3s ease; 
        }
        .status-card.alert { 
            background: #da3633; 
            animation: blink 1s infinite; 
        }

        @keyframes blink { 
            0% { opacity: 1; } 
            50% { opacity: 0.6; } 
            100% { opacity: 1; } 
        }

        /* Camera Feed Container */
        .camera-wrapper { 
            position: relative; 
            width: 100%; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #30363d; 
            aspect-ratio: 4/3; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }

        /* Log Terminal */
        .log-container { 
            margin-top: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 10px; 
            height: 120px; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 0.8rem; 
            color: #8b949e; 
        }
        .log-entry { margin-bottom: 4px; }
        .log-entry.success { color: #3fb950; }
        .log-entry.warn { color: #f85149; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ Live Surveillance Terminal</h2>

        <!-- Status Box -->
        <div id="status-card" class="status-card">SYSTEM ACTIVE - MONITORING</div>

        <!-- Camera Frame -->
        <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <!-- Log Output -->
        <div id="log-terminal" class="log-container">
            <div class="log-entry">[SYSTEM] Initializing system & Telegram menu...</div>
        </div>
    </div>

    <!-- Canvas for Image Capture -->
    <canvas id="captureCanvas"></canvas>

    <script>
        // --- ⚙️ Credentials Configuration ---
        const TELEGRAM_BOT_TOKEN = "8606654492:AAEJA73s0KDpqxPjthTNawpQlz7DYkddd1U";
        const TELEGRAM_CHAT_ID = "8517706642";

        const EMAILJS_SERVICE_ID = "service_9t8ppxg";
        const EMAILJS_PUBLIC_KEY = "ZXgCOupaENPcCchAD";
        
        const EMAILJS_TEMPLATE_HIGHWAY = "template_1efdzc9"; 
        const EMAILJS_TEMPLATE_FOREST = "template_cvp7e1i";  

        let currentLat = "22.3039"; 
        let currentLon = "70.8022";
        let lastUpdateId = 0;

        // Initialize EmailJS
        emailjs.init(EMAILJS_PUBLIC_KEY);

        // --- 1. Camera & GPS Setup ---
        async function initSystem() {
            logMsg("Initializing webcam stream...", "info");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                document.getElementById('webcam').srcObject = stream;
                logMsg("Camera active.", "success");
            } catch (err) {
                logMsg("Camera Access Denied: " + err.message, "warn");
            }

            // Get GPS Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLat = pos.coords.latitude.toFixed(5);
                        currentLon = pos.coords.longitude.toFixed(5);
                        logMsg(`GPS Coordinates Locked: ${currentLat}, ${currentLon}`, "success");
                    },
                    err => logMsg("GPS Error: Using Default Location", "warn")
                );
            }

            // Setup Telegram Keyboard Options & Start Listener
            setupTelegramMenuOptions();
            setInterval(pollTelegramCommands, 2500); // Check for menu button clicks every 2.5 seconds
        }

        // --- 2. Telegram Menu Options Setup ---
        function setupTelegramMenuOptions() {
            const menuPayload = {
                chat_id: TELEGRAM_CHAT_ID,
                text: "🤖 *RoadGuardian & Forest AI Control Panel*\n\nકૃપા કરીને નીચેના વિકલ્પોમાંથી પસંદ કરો:",
                parse_mode: "Markdown",
                reply_markup: {
                    keyboard: [
                        [{ text: "📸 Take Live Snapshot" }, { text: "🚨 Trigger Emergency Alert" }],
                        [{ text: "📍 Get GPS Location" }, { text: "📊 Check System Status" }]
                    ],
                    resize_keyboard: true,
                    persistent: true
                }
            };

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(menuPayload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) logMsg("Telegram Options Keyboard Activated!", "success");
            })
            .catch(err => logMsg("Menu Setup Failed: " + err.message, "warn"));
        }

        // --- 3. Telegram Button Clicks Listener (Polling) ---
        function pollTelegramCommands() {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.result.length > 0) {
                    data.result.forEach(update => {
                        lastUpdateId = update.update_id;
                        if (update.message && update.message.text) {
                            handleTelegramCommand(update.message.text);
                        }
                    });
                }
            })
            .catch(err => console.log("Polling...", err));
        }

        // --- 4. Handle Option Selection ---
        function handleTelegramCommand(commandText) {
            logMsg(`Telegram Command Received: "${commandText}"`, "info");

            switch (commandText) {
                case "📸 Take Live Snapshot":
                    captureAndSendSnapshot("Manual Request from Telegram Menu");
                    break;

                case "🚨 Trigger Emergency Alert":
                    triggerFullAlert("Emergency Alert Triggered via Telegram Menu");
                    break;

                case "📍 Get GPS Location":
                    sendTelegramTextMessage(`📍 *Current System Coordinates*\n\nLatitude: \`${currentLat}\`\nLongitude: \`${currentLon}\`\n\n🔗 Maps Link: https://maps.google.com/?q=${currentLat},${currentLon}`);
                    break;

                case "📊 Check System Status":
                    sendTelegramTextMessage(`📊 *System Health Report*\n\n✅ Camera: Active\n✅ GPS: Locked (${currentLat}, ${currentLon})\n✅ Gmail Service: Active\n⏰ Time: ${new Date().toLocaleString('en-IN')}`);
                    break;

                default:
                    setupTelegramMenuOptions(); // Reset Keyboard if unknown command
                    break;
            }
        }

        // --- 5. Action Functions ---
        function captureAndSendSnapshot(reason) {
            const canvas = document.getElementById('captureCanvas');
            const video = document.getElementById('webcam');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append("chat_id", TELEGRAM_CHAT_ID);
                formData.append("photo", blob, "snapshot.jpg");
                formData.append("caption", `📸 *LIVE SNAPSHOT*\n\n📌 *Reason:* ${reason}\n⏰ *Time:* ${new Date().toLocaleString('en-IN')}`);

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                })
                .then(() => logMsg("Snapshot sent to Telegram", "success"))
                .catch(err => logMsg("Snapshot upload error", "warn"));
            }, 'image/jpeg', 0.8);
        }

        function triggerFullAlert(details) {
            updateStatusBox("EMERGENCY ALERT SENT", true);
            captureAndSendSnapshot("🚨 EMERGENCY THREAT DETECTED!");

            // Send Email to Both Gmail Templates
            const emailParams = {
                alert_type: "MANUAL EMERGENCY",
                details_message: details,
                latitude: currentLat,
                longitude: currentLon,
                google_maps_link: `https://maps.google.com/?q=${currentLat},${currentLon}`,
                timestamp: new Date().toLocaleString('en-IN')
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_HIGHWAY, emailParams);
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_FOREST, emailParams);

            logMsg("Emergency emails dispatched to Highway & Forest Depts", "warn");
            setTimeout(() => updateStatusBox("SYSTEM ACTIVE - MONITORING", false), 6000);
        }

        function sendTelegramTextMessage(msg) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: "Markdown" })
            });
        }

        function logMsg(msg, type = "info") {
            const terminal = document.getElementById('log-terminal');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function updateStatusBox(text, isAlert = false) {
            const box = document.getElementById('status-card');
            box.innerText = text;
            if (isAlert) box.classList.add('alert');
            else box.classList.remove('alert');
        }

        window.onload = initSystem;
    </script>
</body>
</html>
