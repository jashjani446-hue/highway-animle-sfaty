<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gunshot Detection System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        .status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #555; }
        .alert-box { margin-top: 20px; padding: 20px; display: none; background: #dc3545; color: white; font-size: 24px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>AI Gunshot Detection System</h1>
    <p>Science Fair Project Demonstration</p>
    
    <button class="btn" id="startBtn">🔴 Start Live AI Listening</button>
    <div class="status" id="statusText">Status: Stopped</div>
    <div class="alert-box" id="alertBox">⚠️ GUNSHOT DETECTED! ALERTS SENT!</div>

    <script>
        // ======= 1. FREE HUGGING FACE API SETUP =======
        // This public model is trained to detect weapons, gunshots, explosions, and tools.
        const HF_API_URL = "https://huggingface.co";
        
        // IMPORTANT: Replace 'YOUR_HF_TOKEN' with a free token from huggingface.co 
        // Or leave it empty to test (Hugging Face allows limited free requests without a token for testing)
        const HF_API_KEY = "Bearer YOUR_HF_TOKEN"; 

        let mediaRecorder;
        let audioChunks = [];
        let intervalId;

        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('statusText').innerText = "Status: Listening live for gunshots...";
            document.getElementById('statusText').style.color = "blue";
            startRecording();
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // We use standard audio settings that the AI model understands
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioChunks = []; // Reset for next chunk
                    await checkAudioWithAI(audioBlob);
                };

                // CRITICAL FOR REAL-TIME: Automatically cut audio into chunks every 2.5 seconds and send to AI
                intervalId = setInterval(() => {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        mediaRecorder.start();
                    }
                }, 2500);

                mediaRecorder.start();

            } catch (err) {
                alert("Please allow microphone access for the Science Fair demo!");
                console.error(err);
            }
        }

        // ======= 2. AI PROCESSING LAYER (PREVENTS FALSE ALARMS) =======
        async function checkAudioWithAI(blob) {
            try {
                const response = await fetch(HF_API_URL, {
                    headers: { "Authorization": HF_API_KEY },
                    method: "POST",
                    body: blob
                });

                const result = await response.json();
                console.log("AI API Response:", result);

                // Look through the AI classifications for terms matching firearm sounds
                const gunshotData = result.find(item => 
                    item.label.toLowerCase().includes("gunshot") || 
                    item.label.toLowerCase().includes("firearm") ||
                    item.label.toLowerCase().includes("explosion") ||
                    item.label.toLowerCase().includes("weapon")
                );

                // CONFIDENCE THRESHOLD: Adjust 0.40 (40%) up or down depending on your mobile speaker quality
                if (gunshotData && gunshotData.score > 0.40) {
                    showTriggerEffect(gunshotData.label, gunshotData.score);
                } else {
                    document.getElementById('statusText').innerText = "Status: Listening... (Normal speech filtered out)";
                    document.getElementById('statusText').style.color = "green";
                }

            } catch (error) {
                console.error("API Error:", error);
            }
        }

        function showTriggerEffect(label, score) {
            document.getElementById('alertBox').style.display = "block";
            document.getElementById('alertBox').innerText = `⚠️ ${label.toUpperCase()} DETECTED (${Math.round(score * 100)}% Confidence)!`;
            
            // CALL YOUR EMAIL AND TELEGRAM FUNCTIONS HERE (Unchanged)
            sendGmailNotification();
            sendTelegramMessage();

            // Hide the red banner after 4 seconds
            setTimeout(() => {
                document.getElementById('alertBox').style.display = "none";
            }, 4000);
        }

        // ======= 3. YOUR EXISTING NOTIFICATION CODE (PASTE YOURS HERE) =======
        function sendGmailNotification() {
            console.log("Your Gmail code executing smoothly...");
            // Paste your exact Gmail fetch/XHR code here
        }

        function sendTelegramMessage() {
            console.log("Your Telegram Bot code executing smoothly...");
            // Paste your exact Telegram Bot fetch/XHR code here
        }
    </script>
</body>
</html>
