<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Forest & Highway Safety Dashboard</title>
    <!-- TensorFlow.js and COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 10px;
        }
        h1 { color: #00E676; margin: 10px 0 2px 0; font-size: 22px; }
        p.subtitle { color: #aaa; font-size: 12px; margin-bottom: 12px; }

        /* Navigation Bar */
        nav {
            background: #1f1f1f;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #333;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
        }
        nav button {
            background: none;
            border: none;
            color: #aaa;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        nav button.active {
            color: #00e676;
            border-bottom: 3px solid #00e676;
        }

        /* Tab Content */
        .tab-content { display: none; padding: 10px; max-width: 480px; margin: 0 auto; }
        .tab-content.active { display: block; }

        /* Status & Cards */
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .status-box { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }
        .safe { background-color: #2e7d32; color: #ffffff; }
        .alert-bg { background-color: #c62828; color: #ffffff; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Camera Select Dropdowns */
        .cam-select-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .cam-select-group label {
            display: block;
            font-size: 12px;
            color: #00e676;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .cam-select {
            width: 100%;
            padding: 8px 10px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        /* Video Container */
        .video-container {
            position: relative;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            width: 100%;
        }
        video { width: 100%; display: block; }

        /* Logs & Messages Container */
        .list-container {
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            max-height: 380px;
            overflow-y: auto;
            text-align: left;
        }
        .item-card {
            background: #263238;
            border-left: 4px solid #00e676;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .item-card.alert-item { border-left-color: #ff5252; background: #3e1212; }
        .item-time { font-size: 11px; color: #aaa; margin-bottom: 4px; }
        .item-text { font-size: 13px; line-height: 1.4; }

        /* Photo Gallery Grid */
        .photo-grid { display: flex; flex-direction: column; gap: 12px; }
        .photo-card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left; }
        .photo-card img { width: 100%; border-radius: 6px; border: 1px solid #ff5252; margin-top: 6px; }

        /* Buttons */
        .btn-clear {
            background: #dc3545; color: #fff; border: none; padding: 10px;
            font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🛡️ Integrated Monitoring System</h1>
    <p class="subtitle">Gir Forest Guard & RoadGuardian AI System</p>

    <nav>
        <button id="btn-forest" class="active" onclick="switchPage('forest')">🌲 Forest</button>
        <button id="btn-highway" onclick="switchPage('highway')">🛣️ Highway</button>
        <button id="btn-photos" onclick="switchPage('photos')">📸 Photos</button>
        <button id="btn-messages" onclick="switchPage('messages')">💬 Logs</button>
    </nav>

    <!-- 1. GIR FOREST MONITORING PAGE -->
    <div id="forest" class="tab-content active">
        <h2>🌲 Gir Forest Live Guard</h2>
        <div class="card">
            <div id="forestStatus" class="status-box safe">CONNECTING TO CLOUD...</div>
            
            <!-- Forest Camera Selector -->
            <div class="cam-select-group">
                <label for="forestCamSelect">📷 Select Forest Camera:</label>
                <select id="forestCamSelect" class="cam-select" onchange="changeForestCamera(this.value)"></select>
            </div>

            <p style="font-size: 12px; color: #aaa; margin-bottom: 8px;">🎤 Listening for Gunshot Sound:</p>
            <div class="video-container">
                <video id="forestCam" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <!-- 2. HIGHWAY AI MONITORING PAGE -->
    <div id="highway" class="tab-content">
        <h2>🛣️ RoadGuardian AI</h2>
        <div class="card">
            <div id="highwayStatus" class="status-box safe">LOADING AI MODEL...</div>

            <!-- Highway Camera Selector -->
            <div class="cam-select-group">
                <label for="highwayCamSelect">📷 Select Highway Camera:</label>
                <select id="highwayCamSelect" class="cam-select" onchange="changeHighwayCamera(this.value)"></select>
            </div>

            <div class="video-container">
                <video id="highwayCam" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <!-- 3. FOREST CAPTURED PHOTOS PAGE -->
    <div id="photos" class="tab-content">
        <h2>📸 Captured Gunshot Photos</h2>
        <div class="card">
            <div id="photoLog" class="photo-grid">
                <p style="color: #666;">કોઈ ફોટો કેપ્ચર થયો નથી.</p>
            </div>
            <button class="btn-clear" onclick="clearPhotoLogs()">🗑️ Clear Photo History</button>
        </div>
    </div>

    <!-- 4. SYSTEM SMS / LOG MESSAGES PAGE -->
    <div id="messages" class="tab-content">
        <h2>💬 SMS & Alert Logs</h2>
        <div class="card">
            <div class="list-container" id="smsLogContainer"></div>
            <button class="btn-clear" onclick="clearAllLogs()">🗑️ Clear All Logs</button>
        </div>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Firebase SDK v10.7.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCNe68w8w9MqiZ3bBBdSa9D9G5wT9CyHM",
            authDomain: "fore-d68a4.firebaseapp.com",
            databaseURL: "https://fore-d68a4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fore-d68a4",
            storageBucket: "fore-d68a4.firebasestorage.app",
            messagingSenderId: "948704983419",
            appId: "1:948704983419:web:64efa58ae654b21e5fa5de"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // UI References
        const forestBox = document.getElementById('forestStatus');
        const highwayBox = document.getElementById('highwayStatus');
        const forestCam = document.getElementById('forestCam');
        const highwayCam = document.getElementById('highwayCam');
        const forestCamSelect = document.getElementById('forestCamSelect');
        const highwayCamSelect = document.getElementById('highwayCamSelect');
        const photoLog = document.getElementById('photoLog');
        const smsLogContainer = document.getElementById('smsLogContainer');
        const photoCanvas = document.getElementById('photoCanvas');

        let cocoModel = null;
        let isAudioTriggered = false;
        let forestStream = null;
        let highwayStream = null;

        let systemLogs = JSON.parse(localStorage.getItem('sys_logs')) || [];
        let capturedPhotos = JSON.parse(localStorage.getItem('captured_photos')) || [];

        // Tab Switcher
        window.switchPage = function(pageId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(`btn-${pageId}`).classList.add('active');
            if (pageId === 'photos') renderPhotoLogs();
            if (pageId === 'messages') renderSystemLogs();
        };

        // Populate Camera Dropdowns
        async function getAvailableCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                forestCamSelect.innerHTML = '';
                highwayCamSelect.innerHTML = '';

                if (videoDevices.length === 0) {
                    const opt = document.createElement('option');
                    opt.text = "No Camera Found";
                    forestCamSelect.add(opt);
                    highwayCamSelect.add(opt.cloneNode(true));
                    return;
                }

                videoDevices.forEach((device, index) => {
                    const label = device.label || `Camera ${index + 1}`;
                    const opt1 = new Option(label, device.deviceId);
                    const opt2 = new Option(label, device.deviceId);
                    forestCamSelect.add(opt1);
                    highwayCamSelect.add(opt2);
                });

                // Set default cameras if available
                if (videoDevices.length > 1) {
                    highwayCamSelect.selectedIndex = 1; // Pick second camera if present
                }
            } catch (err) {
                console.error("Error listing cameras:", err);
            }
        }

        // Start Forest Camera
        async function startForestCamera(deviceId = null) {
            if (forestStream) {
                forestStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                audio: true,
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" }
            };

            try {
                forestStream = await navigator.mediaDevices.getUserMedia(constraints);
                forestCam.srcObject = forestStream;
                setupSoundDetection(forestStream);
            } catch (err) {
                forestBox.innerText = "❌ Forest Camera Error";
            }
        }

        // Start Highway Camera
        async function startHighwayCamera(deviceId = null) {
            if (highwayStream) {
                highwayStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" }
            };

            try {
                highwayStream = await navigator.mediaDevices.getUserMedia(constraints);
                highwayCam.srcObject = highwayStream;
            } catch (err) {
                highwayBox.innerText = "❌ Highway Camera Error";
            }
        }

        window.changeForestCamera = function(deviceId) {
            startForestCamera(deviceId);
        };

        window.changeHighwayCamera = function(deviceId) {
            startHighwayCamera(deviceId);
        };

        // Sound Detection (Mobile Cam Mic for Gunshot)
        function setupSoundDetection(stream) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const mic = audioContext.createMediaStreamSource(stream);
            analyser.fftSize = 256;
            mic.connect(analyser);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkNoise() {
                analyser.getByteFrequencyData(dataArray);
                let volume = Math.max(...dataArray);

                // High Volume Spike Trigger (>220)
                if (volume > 220 && !isAudioTriggered) {
                    isAudioTriggered = true;
                    triggerGunshotEvent();
                }
                requestAnimationFrame(checkNoise);
            }
            checkNoise();
        }

        // Trigger Gunshot Event & Photo Capture
        function triggerGunshotEvent() {
            forestBox.innerText = "⚠️ ALERT: GUNSHOT DETECTED!";
            forestBox.className = "status-box alert-bg";

            // Photo Capture from Forest Cam
            photoCanvas.width = forestCam.videoWidth || 640;
            photoCanvas.height = forestCam.videoHeight || 480;
            const ctx = photoCanvas.getContext('2d');
            ctx.drawImage(forestCam, 0, 0, photoCanvas.width, photoCanvas.height);
            const imageBase64 = photoCanvas.toDataURL('image/jpeg');

            const timestamp = new Date().toLocaleString();
            
            // Save Photo Log
            capturedPhotos.unshift({ id: Date.now(), image: imageBase64, time: timestamp });
            localStorage.setItem('captured_photos', JSON.stringify(capturedPhotos));

            // Add SMS Alert Log
            addLog(`ALERT: Gunshot sound detected! Photo captured at ${timestamp}`, true);

            setTimeout(() => {
                isAudioTriggered = false;
                forestBox.innerText = "SAFE: NO GUNSHOT DETECTED";
                forestBox.className = "status-box safe";
            }, 6000);
        }

        // Firebase Realtime Status Listener (Forest)
        const statusRef = ref(db, '/forest/status');
        onValue(statusRef, (snapshot) => {
            const val = snapshot.val();
            if (val === 1) {
                forestBox.innerHTML = "⚠️ ALERT: GUNSHOT DETECTED!";
                forestBox.className = "status-box alert-bg";
            } else if (val === 0) {
                forestBox.innerHTML = "SAFE: NO GUNSHOT DETECTED";
                forestBox.className = "status-box safe";
            }
        });

        // Highway AI Animal Detection
        const targetAnimals = ['cat', 'dog', 'cow', 'horse', 'sheep', 'elephant', 'bear'];
        async function runHighwayAI() {
            if (cocoModel && highwayCam.readyState === 4) {
                const predictions = await cocoModel.detect(highwayCam);
                let detected = false;
                let name = "";

                predictions.forEach(p => {
                    if (targetAnimals.includes(p.class.toLowerCase()) && p.score > 0.5) {
                        detected = true;
                        name = p.class.toUpperCase();
                    }
                });

                if (detected) {
                    highwayBox.innerText = `WARNING: ${name} DETECTED!`;
                    highwayBox.className = "status-box alert-bg";
                    addLog(`🚨 Highway Alert: ${name} detected on Rajkot-Gondal Highway.`, true);
                } else {
                    highwayBox.innerText = "SAFE: ROAD CLEAR";
                    highwayBox.className = "status-box safe";
                }
            }
            setTimeout(() => requestAnimationFrame(runHighwayAI), 300);
        }

        // Logs & Photo History System
        function addLog(text, isAlert = false) {
            if (systemLogs.length > 0 && systemLogs[0].text === text) return;
            systemLogs.unshift({ id: Date.now(), text: text, time: new Date().toLocaleTimeString(), isAlert: isAlert });
            localStorage.setItem('sys_logs', JSON.stringify(systemLogs));
        }

        function renderPhotoLogs() {
            if (capturedPhotos.length === 0) {
                photoLog.innerHTML = "<p style='color: #666;'>કોઈ ફોટો કેપ્ચર થયો નથી.</p>";
                return;
            }
            let html = "";
            capturedPhotos.forEach(item => {
                html += `
                    <div class="photo-card">
                        <div class="item-time">🕒 ${item.time}</div>
                        <img src="${item.image}" alt="Gunshot Capture" />
                    </div>
                `;
            });
            photoLog.innerHTML = html;
        }

        function renderSystemLogs() {
            if (systemLogs.length === 0) {
                smsLogContainer.innerHTML = "<p style='color: #666;'>No message logs recorded.</p>";
                return;
            }
            let html = "";
            systemLogs.forEach(log => {
                html += `
                    <div class="item-card ${log.isAlert ? 'alert-item' : ''}">
                        <div class="item-time">🕒 ${log.time}</div>
                        <div class="item-text">${log.text}</div>
                    </div>
                `;
            });
            smsLogContainer.innerHTML = html;
        }

        window.clearPhotoLogs = function() {
            capturedPhotos = [];
            localStorage.removeItem('captured_photos');
            renderPhotoLogs();
        };

        window.clearAllLogs = function() {
            systemLogs = [];
            localStorage.removeItem('sys_logs');
            renderSystemLogs();
        };

        // Initialize App
        async function init() {
            await startForestCamera();
            await startHighwayCamera();
            await getAvailableCameras();

            cocoModel = await cocoSsd.load();
            highwayBox.innerText = "SAFE: ROAD CLEAR";
            runHighwayAI();
            renderSystemLogs();
        }

        window.onload = init;
    </script>
</body>
</html>
