<div style="font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; border: 2px solid #00E676; border-radius: 12px; padding: 20px; background-color: #121212; color: #ffffff;">
  
  <h2 style="color: #00E676; text-align: center; margin-top: 0;">🚨 
    HIGHWAY ANIMAL DETECTED Alert</h2>
  <p style="text-align: center; color: #aaa; font-size: 12px; margin-top: -10px;">Rajkot-Gondal Highway Safety System</p>
  
  <hr style="border: 0.5px solid #333; margin: 15px 0;">

  <div style="background-color: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
    <p style="margin: 5px 0; font-size: 15px;"><strong>⚠️ Message:</strong> <span style="color: #ff5252;">{{message}}</span></p>
    <p style="margin: 5px 0; font-size: 13px; color: #bbb;"><strong>🕒 Time:</strong> {{alert_time}}</p>
    <p style="margin: 5px 0; font-size: 13px; color: #bbb;"><strong>👤 Recipient:</strong> {{to_name}}</p>
  </div>

  <div style="text-align: center; margin-top: 15px;">
    <p style="font-size: 14px; font-weight: bold; color: #00E676; margin-bottom: 8px;">📷 Captured Camera Frame:</p>
    <img src="{{image_data}}" alt="Animal Snapshot" style="width: 100%; max-width: 450px; border: 2px solid #444; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);" />
  </div>

  <hr style="border: 0.5px solid #333; margin: 20px 0 10px 0;">
  <p style="font-size: 11px; color: #666; text-align: center; margin: 0;">This is an automated safety alert generated by RoadGuardian AI.</p>
</div>
