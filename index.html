        const FIREBASE_ALERT_URL = "https://roadguardianai-a8d23-default-rtdb.asia-southeast1.firebasedatabase.app/RoadGuardian/alert.json";

        // EmailJS Credentials
        const EMAILJS_SERVICE_ID = "service_9t8ppxg";
        const EMAILJS_TEMPLATE_ID = "template_1efdzc9"; 
        const EMAILJS_PUBLIC_KEY = "ZXgCOupaENPcCchAD";

        (function(){
            emailjs.init(EMAILJS_PUBLIC_KEY);
        })();

        // રાજકોટ-ગોંડલ હાઈવે કેમેરાનું ચોક્કસ લોકેશન
        const CAMERA_LOCATION = { lat: 22.1800, lng: 70.8100 };
        const MAX_RADIUS_METERS = 500; 

        const video = document.getElementById('webcam');
        const statusBox = document.getElementById('status-box');
        const emailStatus = document.getElementById('emailStatus');
        const messageList = document.getElementById('message-list');
        const photoCanvas = document.getElementById('photoCanvas');

        let model = null;
        let lastAlertState = -1;
        let isCameraActive = true;
        let lastEmailSentTime = 0;
        let savedMessages = JSON.parse(localStorage.getItem('roadGuardian_email_logs')) || [];

        // 📐 Haversine Formula (મીટરમાં અંતર ગણવા)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const r1 = lat1 * Math.PI / 180;
            const r2 = lat2 * Math.PI / 180;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(r1) * Math.cos(r2) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // 1. Tab Switcher
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));

            if (tabName === 'camera') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('camera-page').classList.add('active');
                isCameraActive = true;
            } else if (tabName === 'register') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-page').classList.add('active');
                isCameraActive = false;
            } else {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('notifications-page').classList.add('active');
                isCameraActive = false;
                renderSavedMessages();
            }
        }

        // 2. Register User Gmail & Sync Location
        function registerUserGmailAndGPS() {
            const email = document.getElementById('userEmailInput').value.trim();
            const regStatus = document.getElementById('regStatus');

            if (!email || !email.includes('@')) {
                alert("મહેરબાની કરીને સાચો Gmail એન્ટર કરો!");
                return;
            }

            if ("geolocation" in navigator) {
                regStatus.innerText = "⏳ Getting GPS Location...";
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const userId = 'user_' + email.replace(/[^a-zA-Z0-9]/g, '_');
                    const userData = {
                        gmail: email,
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        timestamp: Date.now()
                    };

                    try {
                        await fetch(`${FIREBASE_USERS_URL}/${userId}.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(userData)
                        });
                        regStatus.innerText = "🟢 Gmail and GPS Location Registered Successfully!";
                        showToast("Gmail Registered!");
                        localStorage.setItem('my_registered_gmail', email);
                    } catch (e) {
                        regStatus.innerText = "❌ Firebase Connection Failed.";
                    }
                }, (err) => {
                    regStatus.innerText = "❌ Please ALLOW Location Access in Browser.";
                });
            } else {
                regStatus.innerText = "❌ Geolocation is not supported by your browser.";
            }
        }

        // 3. Setup Webcam
        async function setupWebcam() {
            return new Promise((resolve, reject) => {
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                }).then((stream) => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => resolve();
                }).catch((err) => reject(err));
            });
        }

        // 4. Update Firebase
        async function updateFirebase(alertState) {
            if (alertState === lastAlertState) return;
            lastAlertState = alertState;

            try {
                await fetch(FIREBASE_ALERT_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(alertState)
                });
            } catch (error) {
                console.error("Firebase Update Failed:", error);
            }
        }

        // 5. Send Gmail Alert to 500m Nearby Registered Users
        async function sendAnimalGmailAlert(detectedAnimal) {
            photoCanvas.width = 320;
            photoCanvas.height = 240;
            const ctx = photoCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
            
            const imageBase64 = photoCanvas.toDataURL('image/jpeg', 0.5);
            const time = new Date().toLocaleString();

            emailStatus.innerText = "⏳ Checking 500m Zone for registered Gmails...";

            try {
                const res = await fetch(`${FIREBASE_USERS_URL}.json`);
                const users = await res.json();

                let recipientList = [];

                if (users) {
                    Object.keys(users).forEach(id => {
                        const user = users[id];
                        const dist = getDistanceMeters(CAMERA_LOCATION.lat, CAMERA_LOCATION.lng, user.lat, user.lng);
                        if (dist <= MAX_RADIUS_METERS) {
                            recipientList.push(user.gmail);
                        }
                    });
                }

                const localUser = localStorage.getItem('my_registered_gmail');
                if (recipientList.length === 0 && localUser) {
                    recipientList.push(localUser);
                }

                if (recipientList.length === 0) {
                    emailStatus.innerText = "⚠️ No registered Gmail users in 500m zone.";
                    return;
                }

                emailStatus.innerText = `⏳ Sending Gmail to ${recipientList.length} nearby users...`;

                recipientList.forEach(email => {
                    const alertMsg = `🚨 ALERT: ${detectedAnimal} detected on Rajkot-Gondal Highway at ${time}. Drive slow!`;
                    
                    const templateParams = {
                        to_name: email,
                        to_email: email,
                        alert_time: time,
                        image_data: imageBase64,
                        message: alertMsg
                    };

                    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                        .then(function() {
                            emailStatus.innerText = `✅ Gmail sent to ${email}`;
                            addMessageToStorage(`✉️ Gmail sent to (${email}): ${alertMsg}`, true);
                            showToast("Gmail Sent!");
                        }, function(error) {
                            emailStatus.innerText = "❌ Email failed to send.";
                            addMessageToStorage(`❌ Gmail failed: ${error.text || 'Error'}`, true);
                        });
                });

            } catch (err) {
                console.error("Gmail Broadcast Error:", err);
            }
        }

        function testEmailDirectly() {

            const time = new Date().toLocaleTimeString();
            const date = new Date().toLocaleDateString();

            const newMsgObj = {
                id: Date.now(),
                text: msgText,
                time: `${date} ${time}`,
                isAlert: isAlert
            };

            savedMessages.unshift(newMsgObj);
            localStorage.setItem('roadGuardian_email_logs', JSON.stringify(savedMessages));
        }

        // 📐 Haversine Formula (મીટરમાં અંતર ગણવા)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const r1 = lat1 * Math.PI / 180;
            const r2 = lat2 * Math.PI / 180;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(r1) * Math.cos(r2) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

                    try {
                        await fetch(`${FIREBASE_USERS_URL}/${userId}.json`, {

                        });

        const targetAnimals = ['cat', 'dog', 'cow', 'horse', 'sheep', 'elephant', 'bear', 'zebra', 'giraffe'];

            if (model && isCameraActive) {
                const predictions = await model.detect(video);
                let isAnimalDetected = false;
                let detectedName = "";

                predictions.forEach(prediction => {
                    if (targetAnimals.includes(prediction.class.toLowerCase()) && prediction.score > 0.5) {
                        isAnimalDetected = true;
                        detectedName = prediction.class.toUpperCase();

                });

                if (isAnimalDetected) {
                    statusBox.innerText = `WARNING: ${detectedName} DETECTED!`;

                    if (distanceFromCameraMeters <= MAX_ALERT_RADIUS_METERS) {
