<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gunshot Detection System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f9; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; margin: 10px; font-weight: bold;}
        .status { margin-top: 20px; font-size: 22px; font-weight: bold; color: #555; padding: 10px; border-radius: 5px; }
        .alert-box { margin-top: 20px; padding: 25px; display: none; background: #dc3545; color: white; font-size: 26px; border-radius: 5px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .log-box { margin-top: 20px; background: #000; color: #00ff00; padding: 15px; text-align: left; font-family: monospace; height: 180px; overflow-y: auto; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🚀 AI ગનશોટ ડિટેક્શન સિસ્ટમ (Science Fair)</h1>
    <p>સ્થાનિક સ્માર્ટ સેન્સર - કોઈ ઇન્ટરનેટ કે API Key ની જરૂર નથી</p>
    
    <button class="btn" id="startBtn">🔴 LIVE AI ચેકિંગ શરૂ કરો</button>
    
    <div class="status" id="statusText" style="background: #e2e2e2;">સ્ટેટસ: બંધ છે (ચાલુ કરવા બટન દબાવો)</div>
    <div class="alert-box" id="alertBox">⚠️ GUNSHOT/EXPLOSION DETECTED! એલાર્મ એક્ટિવેટ!</div>

    <h3>લાઇવ કન્સોલ લોગ (System Progress):</h3>
    <div class="log-box" id="logBox">સિસ્ટમ રેડી છે... શરૂ કરવા ઉપરનું બટન ક્લિક કરો.</div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let isListening = false;

        function addLog(text) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += "<br>> " + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (isListening) return;
            
            addLog("માઈક્રોફોન કનેક્ટ થઈ રહ્યો છે...");
            
            try {
                // બ્રાઉઝર સિક્યોરિટી બાયપાસ કરવા માટે યુઝર ક્લિક પર જ Context બનાવ્યો
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false, // ગનશોટનો તીક્ષ્ણ અવાજ ફિલ્ટર ન થાય એટલે આ ફોલ્સ રાખ્યું
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                
                isListening = true;
                addLog("માઈક સક્સેસફુલી કનેક્ટ થઈ ગયું!");
                document.getElementById('statusText').innerText = "સ્ટેટસ: લાઈવ સાંભળી રહ્યા છીએ... (હવે અવાજ કરો)";
                document.getElementById('statusText').style.color = "green";

                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                microphone.connect(analyser);

                // લાઇવ ડિટેક્શન લૂપ (દર ૧૦૦ મિલિસેકન્ડે ચેક કરશે)
                setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let totalVolume = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        totalVolume += dataArray[i];
                    }
                    let averageVolume = totalVolume / bufferLength;

                    // લાઈવ કન્સોલ પર અવાજનો ગ્રાફ/તીવ્રતા બતાવશે જેથી તમને ખબર પડે કે માઈક કામ કરે છે કે નહીં
                    if(averageVolume > 5) {
                        addLog(`અવાજ પકડાયો -> તીવ્રતા લેવલ: ${Math.round(averageVolume)}`);
                    }

                    // પિચ કે વિસ્ફોટક અવાજ પકડવા માટે થ્રેશોલ્ડ 80 સેટ કર્યો છે (જજ સામે ડેમો માટે બેસ્ટ છે)
                    // જો સામાન્ય બોલવાથી એલાર્મ વાગે તો આ 80 થી વધારીને 120 કરી દેવું
                    if (averageVolume > 80) {
                        triggerAlerts(averageVolume);
                    }
                }, 100);

            } catch (err) {
                document.getElementById('statusText').innerText = "ભૂલ: માઈક એક્સેસ ના મળ્યો!";
                document.getElementById('statusText').style.color = "red";
                addLog("ભૂલ: મહેરબાની કરીને બ્રાઉઝર પરમિશન ચેક કરો.");
                console.error(err);
            }
        });

        // ======= એલાર્મ સિસ્ટમ =======
        function triggerAlerts(volume) {
            document.getElementById('alertBox').style.display = "block";
            document.getElementById('alertBox').innerText = `⚠️ ALERT! HIGH INTENSITY SOUND DETECTED (${Math.round(volume)})`;
            
            addLog(`🚨 ગનશોટ એલાર્મ કન્ફર્મ! ટેલિગ્રામ અને જીમેલ સિસ્ટમ એક્ટિવેટ!`);
            
            sendGmailNotification();
            sendTelegramMessage();

            setTimeout(() => {
                document.getElementById('alertBox').style.display = "none";
            }, 4000);
        }

        // ======= તમારા ઓરિજિનલ એલાર્મ ફંક્શન્સ =======
        function sendGmailNotification() {
            console.log("Gmail notification triggers.");
        }

        function sendTelegramMessage() {
            console.log("Telegram notification triggers.");
        }
    </script>
</body>
</html>
