<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gunshot Selector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f9; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; margin: 10px; font-weight: bold;}
        .status { margin-top: 20px; font-size: 22px; font-weight: bold; color: #555; padding: 10px; border-radius: 5px; }
        .alert-box { margin-top: 20px; padding: 25px; display: none; background: #dc3545; color: white; font-size: 26px; border-radius: 5px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .log-box { margin-top: 20px; background: #000; color: #00ff00; padding: 15px; text-align: left; font-family: monospace; height: 180px; overflow-y: auto; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🚀 એડવાન્સ્ડ ગનશોટ સિલેક્ટર (Science Fair)</h1>
    <p>તાળી અને સામાન્ય અવાજ બ્લોક - માત્ર સાચો ગનશોટ પકડાશે</p>
    
    <button class="btn" id="startBtn">🔴 WIRELESS AI ચેકિંગ શરૂ કરો</button>
    
    <div class="status" id="statusText" style="background: #e2e2e2;">સ્ટેટસ: બંધ છે (ચાલુ કરવા બટન દબાવો)</div>
    <div class="alert-box" id="alertBox">⚠️ REAL GUNSHOT DETECTED! એલાર્મ મોકલાઈ ગયા!</div>

    <h3>લાઇવ કન્સોલ લોગ (System Progress):</h3>
    <div class="log-box" id="logBox">સિસ્ટમ રેડી છે... વાયરલેસ માઈક કનેક્ટ કરી બટન દબાવો.</div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let isListening = false;

        function addLog(text) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += "<br>> " + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (isListening) return;
            addLog("બટન ક્લિક સક્સેસ! ફિલ્ટર એનાલાઇઝર લોડ થઈ રહ્યું છે...");
            startAdvancedFilter();
        });

        async function startAdvancedFilter() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                
                isListening = true;
                document.getElementById('statusText').innerText = "સ્ટેટસ: એડવાન્સ્ડ ફિલ્ટર એક્ટિવ છે...";
                document.getElementById('statusText').style.color = "green";
                addLog("માઈક કનેક્ટ થઈ ગયું. હવે ટેસ્ટ કરો.");

                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                microphone.connect(analyser);

                setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    // ૧. ગનશોટનો બેઝ (Low/Explosion Frequency: index 2 to 15)
                    let bassSum = 0;
                    for (let i = 2; i < 15; i++) {
                        bassSum += dataArray[i];
                    }
                    let bassAvg = bassSum / 13.0;

                    // ૨. ગનશોટની શાર્પનેસ (High-Pitch: index 80 to 220)
                    let highSum = 0;
                    for (let i = 80; i < 220; i++) {
                        highSum += dataArray[i];
                    }
                    let highAvg = highSum / 140.0;

                    // કુલ અવાજની તીવ્રતા
                    let totalVolume = (bassAvg + highAvg) / 2.0;

                    // 🎯 તાળી ફિલ્ટર લોજિક:
                    // જો હાઈ પિચ અને બેઝ બંને ૧૦૦ થી વધુ તીવ્ર હોય (બંદૂકનો ધડાકો) તો જ એલાર્મ થશે.
                    // જો તાળી પાડવા પર હજુ પણ એલાર્મ થાય, તો નીચેની bassAvg > 100 ની વેલ્યુ વધારીને 120 કે 130 કરી દેવી.
                    if (bassAvg > 100 && highAvg > 100 && totalVolume > 110) {
                        triggerAlerts(totalVolume);
                    }
                }, 80); 

            } catch (err) {
                document.getElementById('statusText').innerText = "ભૂલ: માઈક ના મળ્યો!";
                document.getElementById('statusText').style.color = "red";
                addLog("ભૂલ: માઈક પરમિશન આપો.");
                console.error(err);
            }
        }

        function triggerAlerts(volume) {
            document.getElementById('alertBox').style.display = "block";
            document.getElementById('alertBox').innerText = `⚠️ GUNSHOT MATCHED! (Intensity: ${Math.round(volume)})`;
            
            addLog(`🚨 તાળી ફિલ્ટર પાસ! આ સાચો ગનશોટ છે! એલાર્મ ફાયર થયા.`);
            
            sendGmailNotification();
            sendTelegramMessage();

            setTimeout(() => {
                document.getElementById('alertBox').style.display = "none";
            }, 5000);
        }

        function sendGmailNotification() { console.log("Gmail Sent."); }
        function sendTelegramMessage() { console.log("Telegram Sent."); }
    </script>
</body>
</html>
