<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gunshot Detection System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f9; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; margin: 10px; font-weight: bold;}
        .status { margin-top: 20px; font-size: 22px; font-weight: bold; color: #555; padding: 10px; border-radius: 5px; }
        .alert-box { margin-top: 20px; padding: 25px; display: none; background: #dc3545; color: white; font-size: 26px; border-radius: 5px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .log-box { margin-top: 20px; background: #000; color: #00ff00; padding: 15px; text-align: left; font-family: monospace; height: 180px; overflow-y: auto; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🚀 AI ગનશોટ ડિટેક્શન સિસ્ટમ (Science Fair)</h1>
    <p>સ્થાનિક સ્માર્ટ સેન્સર - કોઈ ઇન્ટરનેટ કે API Key ની જરૂર નથી</p>
    
    <button class="btn" id="startBtn">🔴 LIVE AI ચેકિંગ શરૂ કરો</button>
    
    <div class="status" id="statusText" style="background: #e2e2e2;">સ્ટેટસ: બંધ છે (ચાલુ કરવા બટન દબાવો)</div>
    <div class="alert-box" id="alertBox">⚠️ GUNSHOT DETECTED! ટેલિગ્રામ અને જીમેલ એલાર્મ મોકલાઈ ગયા!</div>

    <h3>લાઇવ કન્સોલ લોગ (System Progress):</h3>
    <div class="log-box" id="logBox">સિસ્ટમ રેડી છે... શરૂ કરવા ઉપરનું બટન ક્લિક કરો.</div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isListening = false;

        function addLog(text) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += "<br>> " + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (isListening) return;
            
            document.getElementById('statusText').innerText = "સ્ટેટસ: માઈક્રોફોન કનેક્ટ થઈ રહ્યો છે...";
            document.getElementById('statusText').style.color = "blue";
            addLog("સ્થાનિક ઓડિયો એનાલાઇઝર શરૂ થઈ રહ્યું છે...");
            
            startLocalDetection();
        });

        // ======= ઓપન-સોર્સ લોકલ ફ્રીક્વન્સી ડિટેક્શન લૂપ =======
        async function startLocalDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isListening = true;
                
                addLog("માઈક સક્સેસફુલી કનેક્ટ થઈ ગયું!");
                document.getElementById('statusText').innerText = "સ્ટેટસ: લાઈવ સાંભળી રહ્યા છીએ... (મોબાઈલમાં અવાજ પ્લે કરો)";
                document.getElementById('statusText').style.color = "green";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                // બંદૂકના અવાજની તીવ્રતા માપવા માટે ફાસ્ટ ફોરિયર ટ્રાન્સફોર્મ સેટિંગ
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                microphone.connect(analyser);

                // રીઅલ-ટાઇમ ઓડિયો ફ્રીક્વન્સી પ્રોસેસિંગ
                setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    // બંદૂકના અવાજ (તીવ્ર વિસ્ફોટ) માટે ઉચ્ચ અને મધ્યમ ફ્રીક્વન્સી ચેક
                    let highFreqSum = 0;
                    for (let i = 10; i < bufferLength; i++) {
                        highFreqSum += dataArray[i];
                    }
                    
                    let averageVolume = highFreqSum / (bufferLength - 10);

                    // જ્યારે મોબાઈલનો મોટો ગનશોટ અવાજ માઈકની નજીક વાગશે ત્યારે જ ટ્રિગર થશે
                    // જો સામાન્ય વાતચીતમાં ટ્રિગર થાય તો આ ૧૬૦ ની વેલ્યુ વધારીને ૧૮૦ કરી દેવી
                    if (averageVolume > 160) {
                        triggerAlerts(averageVolume);
                    }
                }, 100);

            } catch (err) {
                document.getElementById('statusText').innerText = "ભૂલ: માઈક એક્સેસ ના મળ્યો!";
                document.getElementById('statusText').style.color = "red";
                addLog("ભૂલ: મહેરબાની કરીને બ્રાઉઝરમાં માઈક પરમિશન આપો.");
                console.error(err);
            }
        }

        // ======= એલાર્મ સિસ્ટમ =======
        function triggerAlerts(volume) {
            document.getElementById('alertBox').style.display = "block";
            document.getElementById('alertBox').innerText = `⚠️ GUNSHOT/EXPLOSION DETECTED (Volume Intensity: ${Math.round(volume)})!`;
            
            addLog(`🚨 ગનશોટ સિગ્નલ કન્ફર્મ (તીવ્રતા: ${Math.round(volume)})! એલાર્મ એક્ટિવેટ થઈ રહ્યા છે...`);
            
            sendGmailNotification();
            sendTelegramMessage();

            setTimeout(() => {
                document.getElementById('alertBox').style.display = "none";
            }, 5000);
        }

        // ======= તમારા ઓરિજિનલ એલાર્મ ફંક્શન્સ =======
        function sendGmailNotification() {
            console.log("Gmail notification triggers perfectly here.");
        }

        function sendTelegramMessage() {
            console.log("Telegram notification triggers perfectly here.");
        }
    </script>
</body>
</html>
